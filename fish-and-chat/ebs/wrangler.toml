name = "fish-and-chat-ebs"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Save storage. `database_id` comes from `wrangler d1 create fish-and-chat-saves`
# — paste the printed id here. Schema lives in migrations/, applied with
# `wrangler d1 migrations apply fish-and-chat-saves [--remote]`.
[[d1_databases]]
binding = "DB"
database_name = "fish-and-chat-saves"
database_id = "558df479-413b-4a4e-8884-5e58d2ea4ace"
migrations_dir = "migrations"

# Secrets (never set here — use `wrangler secret put <NAME>` / .dev.vars locally):
#   TWITCH_EXTENSION_SECRET  — base64 JWT-signing secret from the Twitch dev console
#   TWITCH_CLIENT_ID         — the extension's client ID (not secret, but set alongside the above)
